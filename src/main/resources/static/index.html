<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LuminiCall — Video en tiempo real</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- ── LOBBY ── -->
  <div id="lobby" class="screen">
    <div class="noise"></div>
    <div class="grid-lines"></div>
    <div class="lobby-inner">
      <div class="brand mb-5">
        <div class="brand-icon">
          <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="17" stroke="var(--accent)" stroke-width="1.5"/>
            <circle cx="18" cy="18" r="6" fill="var(--accent)"/>
            <line x1="18" y1="1" x2="18" y2="8" stroke="var(--accent)" stroke-width="1.5"/>
            <line x1="18" y1="28" x2="18" y2="35" stroke="var(--accent)" stroke-width="1.5"/>
            <line x1="1" y1="18" x2="8" y2="18" stroke="var(--accent)" stroke-width="1.5"/>
            <line x1="28" y1="18" x2="35" y2="18" stroke="var(--accent)" stroke-width="1.5"/>
          </svg>
        </div>
        <span class="brand-name">LuminiCall</span>
      </div>

      <h1 class="lobby-headline">Conecta.<br/>Sin barreras.</h1>
      <p class="lobby-sub">Video P2P cifrado · Sin cuentas · Sin plugins</p>

      <div class="room-form">
        <div class="input-wrapper">
          <label class="input-label">SALA</label>
          <input id="roomInput" type="text" class="room-input" placeholder="ej. alfa-7, lunar-base…" autocomplete="off"/>
        </div>
        <button id="joinBtn" class="join-btn">
          <span>Unirse</span>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div id="lobbyStatus" class="lobby-status"></div>
    </div>
  </div>

  <!-- ── CALL ROOM ── -->
  <div id="callRoom" class="screen d-none">
    <div class="noise"></div>

    <!-- Header bar -->
    <div class="call-header">
      <div class="brand small">
        <div class="brand-icon sm">
          <svg width="20" height="20" viewBox="0 0 36 36" fill="none">
            <circle cx="18" cy="18" r="17" stroke="var(--accent)" stroke-width="2"/>
            <circle cx="18" cy="18" r="6" fill="var(--accent)"/>
          </svg>
        </div>
        <span class="brand-name">LuminiCall</span>
      </div>
      <div class="room-pill">
        <span class="room-pill-dot"></span>
        <span id="roomLabel">—</span>
      </div>
      <div id="callTimer" class="call-timer">00:00</div>
    </div>

    <!-- Videos -->
    <div class="video-stage" id="videoStage">
      <!-- Remote (main) -->
      <div class="video-box remote-box" id="remoteBox">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="video-overlay remote-overlay">
          <span class="peer-label">Remoto</span>
        </div>
        <div id="waitingPlaceholder" class="waiting-placeholder">
          <div class="pulse-ring"></div>
          <p>Esperando al otro participante…</p>
        </div>
      </div>

      <!-- Local (PiP) -->
      <div class="video-box local-box" id="localBox">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="video-overlay local-overlay">
          <span class="peer-label">Tú</span>
        </div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls-bar">
      <button id="micBtn" class="ctrl-btn active" title="Silenciar micrófono">
        <svg class="icon-on" width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4z" stroke="currentColor" stroke-width="1.8"/>
          <path d="M19 10a7 7 0 0 1-14 0M12 19v4M8 23h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <svg class="icon-off d-none" width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 1a4 4 0 0 1 4 4v4M9.5 3.5A4 4 0 0 0 8 5v6a4 4 0 0 0 5.9 3.5M19 10a7 7 0 0 1-1.5 4.4M4.5 4.5 19.5 19.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M5.3 10a7 7 0 0 0 6.7 7M12 19v4M8 23h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="ctrl-label">Mic</span>
      </button>

      <button id="camBtn" class="ctrl-btn active" title="Apagar cámara">
        <svg class="icon-on" width="22" height="22" viewBox="0 0 24 24" fill="none">
          <rect x="2" y="6" width="14" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M16 10l5-3v10l-5-3" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <svg class="icon-off d-none" width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M1 1l22 22M8 6H4a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 1.8-1.1M16 10l5-3v10l-3.7-2.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="ctrl-label">Cámara</span>
      </button>

      <button id="hangupBtn" class="ctrl-btn hangup" title="Colgar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M2.5 16.8c1.8 1.8 7.5 1.5 9.5-2.5 2 4 7.7 4.3 9.5 2.5 1.3-1.3.4-3.3-1.3-3.5l-2.7-.4a1.5 1.5 0 0 0-1.5 1l-.5 1.5C13.8 16 12 15.3 12 15.3s-1.8.7-4 .6l-.5-1.5a1.5 1.5 0 0 0-1.5-1L3.8 13.3c-1.7.2-2.6 2.2-1.3 3.5z" stroke="currentColor" stroke-width="1.8" fill="none"/>
        </svg>
        <span class="ctrl-label">Colgar</span>
      </button>

      <button id="fullscreenBtn" class="ctrl-btn" title="Pantalla completa">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="ctrl-label">Full</span>
      </button>
    </div>

    <!-- Status toast -->
    <div id="statusToast" class="status-toast"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
